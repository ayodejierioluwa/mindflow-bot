[project]
name = "mindflow-bot"
version = "0.1.0"
description = "Mindflow AI Voice and Thought Assistant for Telegram"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "groq>=0.9.0",
    "google-genai>=0.1.1",
    "openai>=1.35.0",
    "aiofiles>=24.1.0",
]

[tool.vercel]
entrypoint = "api.webhook:handler"
